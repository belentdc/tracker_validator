<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDC Transport Tracker — Validation Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1c2b2a; --paper:#f6f4ee; --card:#ffffff; --line:#dcd8cc;
  --muted:#6c6a61; --accent:#0f6e56; --accent-soft:#e1f5ee;
  --amber-bg:#faeeda; --amber-ink:#633806; --amber-line:#ef9f27;
  --green-bg:#eaf3de; --green-ink:#27500a;
  --danger:#a32d2d; --danger-bg:#fcebeb;
  --radius:10px; --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e8e6dd; --paper:#16201f; --card:#1d2827; --line:#34403e;
    --muted:#9b988e; --accent:#5dcaa5; --accent-soft:#0f3a30;
    --amber-bg:#3a2a10; --amber-ink:#fac775; --amber-line:#854f0b;
    --green-bg:#1f3010; --green-ink:#c0dd97; --danger:#f09595; --danger-bg:#3a1414; }
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--card)}
header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
header .sub{font-size:13px;color:var(--muted)}
header .spacer{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.12s}
.btn:hover{background:var(--paper)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
input[type=text],select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--card);color:var(--ink);width:100%}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meta-grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{font-size:13px;padding:9px 15px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;color:var(--muted);position:relative;top:1px}
.tab.active{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.tab .count{display:inline-block;min-width:18px;text-align:center;font-size:11px;background:var(--paper);border-radius:9px;padding:0 5px;margin-left:5px}
.tab.active .count{background:var(--accent-soft);color:var(--accent)}
.rowcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card)}
.rowcard.flagged{border-color:var(--amber-line);background:var(--amber-bg)}
.rowcard.confirmed{border-left:3px solid var(--accent)}
.rowhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:7px;font-weight:500}
.pill.dom{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--green-bg);color:var(--green-ink)}
.pill.flag{background:var(--amber-bg);color:var(--amber-ink);border:1px solid var(--amber-line)}
.pill.src{background:var(--paper);color:var(--muted)}
.rowhead .page{margin-left:auto;font-size:12px;color:var(--muted)}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:720px){.quotes{grid-template-columns:1fr}}
.qbox label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.qbox .verb{font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;line-height:1.45}
.qbox .trans{font-size:14px;color:var(--muted);padding:8px 2px;line-height:1.45}
.qbox textarea{min-height:62px;font-family:var(--sans);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.fields .f label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.multi{border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--card);max-height:108px;overflow:auto}
.multi label{display:flex;align-items:center;gap:6px;font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);padding:2px 0;cursor:pointer}
.multi label.parent{font-weight:600;margin-top:3px}
.multi label.child{padding-left:16px}
.note{font-size:12.5px;background:var(--paper);border:1px dashed var(--line);border-radius:7px;padding:8px 10px;margin-bottom:10px;color:var(--ink)}
.note b{color:var(--amber-ink)}
.note textarea{min-height:42px;margin-top:6px;font-family:var(--sans);font-size:13px}
.rowfoot{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}
.rowfoot .right{margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.summary b{color:var(--ink);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
code{font-family:var(--mono);font-size:12px;background:var(--paper);padding:1px 5px;border-radius:4px}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
</style>
</head>
<body>
<header>
  <h1>NDC Transport Tracker</h1>
  <span class="sub">Validation console</span>
  <span class="spacer"></span>
  <div class="row-flex">
    <button class="btn" id="loadSample">Load Cameroon sample</button>
    <button class="btn" id="importBtn">Import JSON</button>
    <button class="btn" id="saveDraft">Save draft</button>
    <button class="btn primary" id="exportBtn">Export to Excel</button>
  </div>
</header>
<div class="wrap">

  <div class="panel" id="inputPanel">
    <h2>1 · Paste extraction</h2>
    <textarea id="jsonIn" placeholder="Paste the extraction JSON here, then click Parse. Or use Load Cameroon sample above to see it working."></textarea>
    <div class="row-flex" style="margin-top:10px">
      <button class="btn primary" id="parseBtn">Parse extraction</button>
      <input type="file" id="fileIn" accept=".json" style="display:none">
      <span class="hint">Source-agnostic: works with output from Claude now, the Policy Miner later — same JSON shape.</span>
    </div>
  </div>

  <div class="panel" id="metaPanel" style="display:none">
    <h2>2 · Document metadata <span style="font-weight:400;text-transform:none;letter-spacing:0">(stamped onto every exported row)</span></h2>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="hint" id="genNote" style="margin-top:10px"></div>
  </div>

  <div id="board" style="display:none">
    <div class="summary" id="summary"></div>
    <div class="tabs" id="tabs"></div>
    <div id="rows"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

const DOMAINS = [
  {key:"target", label:"Targets"},
  {key:"mitigation", label:"Mitigation"},
  {key:"adaptation", label:"Adaptation"},
  {key:"benefit", label:"Benefits"},
];
const META_FIELDS = [
  ["documentId","Document ID"],["country","Country"],["countryCode","Country code"],
  ["typeOfDocument","Type of document"],["documentName","Document name"],
  ["versionNumber","Version number"],["status","Status"],["date","Date"],
  ["region","Region"],["language","Language"],
];

let state = {meta:{}, rows:[]};
let activeTab = "target";

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function uid(){return "r"+Math.random().toString(36).slice(2,9);}
function opt(list, val){
  return '<option value=""></option>'+list.map(o=>{
    const lab = typeof o==="string"?o:o.label;
    const sel = lab===val?" selected":"";
    return `<option${sel}>${esc(lab)}</option>`;
  }).join("");
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function purposesFor(catLabel){const c=TAX.mitigation.find(c=>c.label===catLabel);return c?c.purposes:[];}
function instrumentsFor(catLabel,purpLabel){const ps=purposesFor(catLabel);const p=ps.find(p=>p.label===purpLabel);return p?p.instruments:[];}
function measuresFor(catLabel){const c=TAX.adaptation.find(c=>c.label===catLabel);return c?c.measures:[];}

function multiBox(rowId, field, values, selected){
  selected = selected||[];
  let h='<div class="multi">';
  values.forEach(v=>{
    const lab=v.label;
    const checked=selected.includes(lab)?"checked":"";
    h+=`<label class="parent"><input type="checkbox" data-row="${rowId}" data-field="${field}" value="${esc(lab)}" ${checked}>${esc(lab)}</label>`;
    (v.children||[]).forEach(ch=>{
      const c2=selected.includes(ch)?"checked":"";
      h+=`<label class="child"><input type="checkbox" data-row="${rowId}" data-field="${field}" value="${esc(ch)}" ${c2}>${esc(ch)}</label>`;
    });
  });
  return h+'</div>';
}

function fieldsHtml(r){
  const f=r.fields||{};
  if(r.domain==="target"){
    return `
    <div class="f"><label>Target area</label><select data-row="${r.id}" data-field="area">${opt(TAX.targets.area,f.area)}</select></div>
    <div class="f"><label>Target scope</label><select data-row="${r.id}" data-field="scope">${opt(TAX.targets.scope,f.scope)}</select></div>
    <div class="f"><label>GHG target?</label><select data-row="${r.id}" data-field="ghg">${opt(TAX.targets.ghg,f.ghg)}</select></div>
    <div class="f"><label>Target type</label><select data-row="${r.id}" data-field="type">${opt(TAX.targets.type,f.type)}</select></div>
    <div class="f"><label>Conditionality</label><select data-row="${r.id}" data-field="conditionality">${opt(TAX.targets.conditionality,f.conditionality)}</select></div>
    <div class="f"><label>Target year</label><input type="text" data-row="${r.id}" data-field="targetYear" value="${esc(f.targetYear)}"></div>
    <div class="f"><label>ICE phase-out type</label><select data-row="${r.id}" data-field="ice">${opt(TAX.targets.ice,f.ice)}</select></div>`;
  }
  if(r.domain==="mitigation"){
    const ps=purposesFor(f.category);
    const ins=instrumentsFor(f.category,f.purpose);
    return `
    <div class="f"><label>Category</label><select data-row="${r.id}" data-field="category" data-cascade="mit-cat">${opt(TAX.mitigation,f.category)}</select></div>
    <div class="f"><label>Purpose</label><select data-row="${r.id}" data-field="purpose" data-cascade="mit-purp">${opt(ps,f.purpose)}</select></div>
    <div class="f"><label>Instrument</label><select data-row="${r.id}" data-field="instrument">${opt(ins,f.instrument)}</select></div>
    <div class="f"><label>A-S-I</label><select data-row="${r.id}" data-field="asi">${opt(TAX.asi,f.asi)}</select></div>
    <div class="f"><label>Activity</label><select data-row="${r.id}" data-field="activity">${opt(TAX.activity,f.activity)}</select></div>
    <div class="f"><label>Status of measure</label><select data-row="${r.id}" data-field="status">${opt(TAX.status_of_measure,f.status)}</select></div>
    <div class="f"><label>Mode(s)</label>${multiBox(r.id,"mode",TAX.mode,f.mode)}</div>
    <div class="f"><label>Geography</label>${multiBox(r.id,"geography",TAX.geography,f.geography)}</div>`;
  }
  if(r.domain==="adaptation"){
    const ms=measuresFor(f.category);
    return `
    <div class="f"><label>Category</label><select data-row="${r.id}" data-field="category" data-cascade="ada-cat">${opt(TAX.adaptation,f.category)}</select></div>
    <div class="f"><label>Measure</label><select data-row="${r.id}" data-field="measure">${opt(ms,f.measure)}</select></div>
    <div class="f"><label>Activity</label><select data-row="${r.id}" data-field="activity">${opt(TAX.activity,f.activity)}</select></div>
    <div class="f"><label>Mode(s)</label>${multiBox(r.id,"mode",TAX.mode,f.mode)}</div>
    <div class="f"><label>Geography</label>${multiBox(r.id,"geography",TAX.geography,f.geography)}</div>`;
  }
  if(r.domain==="benefit"){
    return `<div class="f"><label>Type of benefit</label><select data-row="${r.id}" data-field="benefit">${opt(TAX.benefits,f.benefit)}</select></div>`;
  }
  return "";
}

function rowCard(r){
  const cls=["rowcard"]; if(r.flagged)cls.push("flagged"); if(r.confirmed)cls.push("confirmed");
  return `<div class="${cls.join(' ')}" data-rowcard="${r.id}">
    <div class="rowhead">
      <span class="pill dom">${esc(DOMAINS.find(d=>d.key===r.domain).label)}</span>
      ${r.confirmed?'<span class="pill ok">confirmed</span>':''}
      ${r.flagged?'<span class="pill flag">flagged</span>':''}
      <span class="pill src">${esc(r.source||"claude")}</span>
      <span class="page">p.<input type="text" data-quote="page" data-row="${r.id}" value="${esc(r.page||"")}" style="width:54px;font-size:12px;padding:2px 5px"></span>
    </div>
    <div class="quotes">
      <div class="qbox"><label>Verbatim (${esc(r.lang||"?")}) — exported · editable</label><textarea data-quote="verbatim" data-row="${r.id}">${esc(r.verbatim)}</textarea></div>
      <div class="qbox"><label>Translation (EN) — validation only · editable</label><textarea data-quote="translation" data-row="${r.id}">${esc(r.translation)}</textarea></div>
    </div>
    <div class="fields">${fieldsHtml(r)}</div>
    ${r.note?`<div class="note"><b>Note:</b> ${esc(r.note)}</div>`:''}
    <div class="rowfoot">
      <button class="btn" data-act="confirm" data-row="${r.id}">${r.confirmed?'Unconfirm':'Confirm'}</button>
      <button class="btn" data-act="duplicate" data-row="${r.id}">Duplicate for 2nd classification</button>
      <button class="btn" data-act="newentry" data-row="${r.id}">Duplicate as new entry</button>
      <button class="btn" data-act="flag" data-row="${r.id}">${r.flagged?'Unflag':'Flag'}</button>
      <button class="btn danger right" data-act="delete" data-row="${r.id}">Delete</button>
    </div>
  </div>`;
}

function render(){
  // meta
  const mg=document.getElementById("metaGrid");
  mg.innerHTML=META_FIELDS.map(([k,lab])=>`<div><label>${lab}</label><input type="text" data-meta="${k}" value="${esc(state.meta[k]||"")}"></div>`).join("");
  document.getElementById("genNote").textContent = state.meta.generationNote||"";
  // tabs
  document.getElementById("tabs").innerHTML=DOMAINS.map(d=>{
    const n=state.rows.filter(r=>r.domain===d.key).length;
    return `<div class="tab ${d.key===activeTab?'active':''}" data-tab="${d.key}">${d.label}<span class="count">${n}</span></div>`;
  }).join("");
  // summary
  const total=state.rows.length, conf=state.rows.filter(r=>r.confirmed).length, flag=state.rows.filter(r=>r.flagged).length;
  document.getElementById("summary").innerHTML=`<span><b>${total}</b> rows</span><span><b>${conf}</b> confirmed</span><span><b>${flag}</b> flagged</span><span><b>${total-conf}</b> pending</span>`;
  // rows
  const rs=state.rows.filter(r=>r.domain===activeTab);
  const addBar='<div style="margin-bottom:12px"><button class="btn" data-act="addblank">+ Add blank '+DOMAINS.find(d=>d.key===activeTab).label.replace(/s$/,'').toLowerCase()+' row</button></div>';
  document.getElementById("rows").innerHTML = addBar + (rs.length? rs.map(rowCard).join("") : '<div class="empty">No rows in this category yet — use “Add blank row”.</div>');
}

function findRow(id){return state.rows.find(r=>r.id===id);}

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.meta!==undefined){state.meta[el.dataset.meta]=el.value;return;}
  if(el.dataset.quote!==undefined && el.dataset.row){
    const r=findRow(el.dataset.row); r[el.dataset.quote]=el.value; return;
  }
  if(el.type==="checkbox" && el.dataset.row){
    const r=findRow(el.dataset.row); const fld=el.dataset.field;
    r.fields[fld]=r.fields[fld]||[];
    if(el.checked){if(!r.fields[fld].includes(el.value))r.fields[fld].push(el.value);}
    else{r.fields[fld]=r.fields[fld].filter(v=>v!==el.value);}
    return;
  }
  if(el.dataset.row){
    const r=findRow(el.dataset.row);
    r.fields[el.dataset.field]=el.value;
    if(el.dataset.cascade==="mit-cat"){r.fields.purpose="";r.fields.instrument="";render();}
    if(el.dataset.cascade==="mit-purp"){r.fields.instrument="";render();}
    if(el.dataset.cascade==="ada-cat"){r.fields.measure="";render();}
  }
});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){activeTab=t.dataset.tab;render();return;}
  const b=e.target.closest("[data-act]");
  if(b){
    const r=findRow(b.dataset.row);
    if(b.dataset.act==="confirm"){r.confirmed=!r.confirmed;}
    if(b.dataset.act==="flag"){r.flagged=!r.flagged;}
    if(b.dataset.act==="delete"){state.rows=state.rows.filter(x=>x.id!==r.id);}
    if(b.dataset.act==="duplicate"){
      const copy=JSON.parse(JSON.stringify(r));copy.id=uid();copy.confirmed=false;
      copy.note=(copy.note?copy.note+" ":"")+"[duplicate — assign a different classification]";copy.flagged=true;
      const idx=state.rows.indexOf(r);state.rows.splice(idx+1,0,copy);
    }
    if(b.dataset.act==="newentry"){
      const copy=JSON.parse(JSON.stringify(r));copy.id=uid();copy.confirmed=false;copy.flagged=false;
      copy.note="[new entry — edit the quote and classification]";copy.source="manual";
      const idx=state.rows.indexOf(r);state.rows.splice(idx+1,0,copy);
    }
    if(b.dataset.act==="addblank"){
      state.rows.push({id:uid(),domain:activeTab,lang:(state.meta.language||""),page:"",
        verbatim:"",translation:"",fields:{},confirmed:false,flagged:false,
        note:"[manual entry]",source:"manual"});
    }
    render();
  }
});

function loadDoc(doc){
  state.meta=doc.meta||{};
  state.rows=(doc.rows||[]).map(r=>{r.id=r.id||uid();r.fields=r.fields||{};return r;});
  document.getElementById("metaPanel").style.display="";
  document.getElementById("board").style.display="";
  render();
}

document.getElementById("parseBtn").onclick=()=>{
  try{const doc=JSON.parse(document.getElementById("jsonIn").value);loadDoc(doc);toast("Parsed "+state.rows.length+" rows");}
  catch(err){toast("Invalid JSON: "+err.message);}
};
document.getElementById("loadSample").onclick=()=>{loadDoc(JSON.parse(JSON.stringify(SAMPLE)));toast("Sample loaded");};
document.getElementById("importBtn").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{loadDoc(JSON.parse(rd.result));toast("Imported");}catch(err){toast("Invalid file");}};rd.readAsText(f);
};
document.getElementById("saveDraft").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=(state.meta.countryCode||"draft")+"_validation_draft.json";a.click();toast("Draft saved");
};

// ---------- EXPORT ----------
function metaCols(){
  const m=state.meta;
  return {
    "Document ID":m.documentId||"", "Country Code":m.countryCode||"", "Country":m.country||"",
    "Type of Document":m.typeOfDocument||"", "Document name":m.documentName||"",
    "Version number":m.versionNumber||"", "Status":m.status||"", "Date":m.date||"",
  };
}
function modeCols(sel){
  sel=sel||[];
  const all=["Mode: Not defined","Informal transport","Active mobility","Walking","Cycling","Road","Two-/Three-wheelers","Cars","Private cars","Taxis","Truck","Bus","Rail","Heavy rail","High-speed rail","Transit rail","Water","Coastal shipping","Inland shipping","International maritime","Aviation","Domestic aviation","International aviation"];
  const o={};all.forEach(c=>o[c]=sel.includes(c)?"x":"");return o;
}
function geoCols(sel){
  sel=sel||[];const all=["Geography: Not defined","Urban","Rural","Inter-city"];
  const o={};all.forEach(c=>o[c]=sel.includes(c)?"x":"");return o;
}
function exportXlsx(){
  if(!state.rows.length){toast("Nothing to export");return;}
  const wb=XLSX.utils.book_new();
  const M=metaCols();
  // Targets
  const tg=state.rows.filter(r=>r.domain==="target").map(r=>({
    ...M,"Target area":r.fields.area||"","Target scope":r.fields.scope||"","GHG target?":r.fields.ghg||"",
    "Target type":r.fields.type||"","Conditionality":r.fields.conditionality||"","Target Year":r.fields.targetYear||"",
    "ICE phase-out":r.fields.ice||"","Content":r.verbatim||"","Page Number":r.page||"",
    "Translation (EN)":r.translation||"","Validated":r.confirmed?"yes":"","Flag note":r.flagged?(r.note||"flagged"):""
  }));
  // Mitigation
  const mit=state.rows.filter(r=>r.domain==="mitigation").map(r=>({
    ...M,"Region":state.meta.region||"","Category":r.fields.category||"","Purpose":r.fields.purpose||"",
    "Instrument":r.fields.instrument||"","Quote":r.verbatim||"","A-S-I":r.fields.asi||"","Page Number":r.page||"",
    ...modeCols(r.fields.mode),...geoCols(r.fields.geography),
    "Activity type":r.fields.activity||"","Status of measure":r.fields.status||"",
    "Translation (EN)":r.translation||"","Validated":r.confirmed?"yes":"","Flag note":r.flagged?(r.note||"flagged"):""
  }));
  // Adaptation
  const ada=state.rows.filter(r=>r.domain==="adaptation").map(r=>({
    ...M,"Category":r.fields.category||"","Measure":r.fields.measure||"","Quote":r.verbatim||"","Page Number":r.page||"",
    ...modeCols(r.fields.mode),...geoCols(r.fields.geography),"Activity type":r.fields.activity||"",
    "Translation (EN)":r.translation||"","Validated":r.confirmed?"yes":"","Flag note":r.flagged?(r.note||"flagged"):""
  }));
  // Benefits
  const ben=state.rows.filter(r=>r.domain==="benefit").map(r=>({
    ...M,"Type of benefit":r.fields.benefit||"","Quote":r.verbatim||"","Page Number":r.page||"",
    "Translation (EN)":r.translation||"","Validated":r.confirmed?"yes":"","Flag note":r.flagged?(r.note||"flagged"):""
  }));
  const add=(name,rows)=>{if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name);};
  add("Targets",tg);add("Mitigation",mit);add("Adaptation",ada);add("Benefits",ben);
  if(!wb.SheetNames.length){toast("Nothing to export");return;}
  XLSX.writeFile(wb,(state.meta.countryCode||"NDC")+"_transport_tracker.xlsx");
  toast("Excel exported");
}
document.getElementById("exportBtn").onclick=exportXlsx;
</script>
